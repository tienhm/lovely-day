name: Publish to Extension Stores

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Build ──────────────────────────────────────────────────
      - name: Build Chrome / Edge package
        run: |
          mkdir _tmp
          cp manifest.json content.js popup.html popup.js background.js _tmp/
          cp -r icons _locales _tmp/
          jq 'del(.background.scripts)' _tmp/manifest.json > _tmp/m.json && mv _tmp/m.json _tmp/manifest.json
          mkdir -p dist
          cd _tmp && zip -qr ../dist/chrome.zip . && cd ..
          rm -rf _tmp

      - name: Build Firefox package
        run: |
          mkdir _tmp
          cp manifest.json content.js popup.html popup.js background.js _tmp/
          cp -r icons _locales _tmp/
          jq 'del(.background.service_worker)' _tmp/manifest.json > _tmp/m.json && mv _tmp/m.json _tmp/manifest.json
          cd _tmp && zip -qr ../dist/firefox.xpi . && cd ..
          rm -rf _tmp

      # ── Chrome Web Store ───────────────────────────────────────
      - name: Publish to Chrome Web Store
        env:
          CLIENT_ID:     ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID:  ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID&client_secret=$CLIENT_SECRET&refresh_token=$REFRESH_TOKEN&grant_type=refresh_token" \
            | jq -r '.access_token')
          curl -sf -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T dist/chrome.zip
          curl -sf -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0"

      # ── Edge Add-ons ───────────────────────────────────────────
      - name: Publish to Edge Add-ons
        env:
          API_KEY:    ${{ secrets.EDGE_API_KEY }}
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          OP=$(curl -sf -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions/draft/package" \
            -H "Authorization: ApiKey $API_KEY" \
            -H "Content-Type: application/zip" \
            --data-binary @dist/chrome.zip | jq -r '.id')
          echo "Upload operation: $OP"
          for i in $(seq 1 12); do
            STATUS=$(curl -sf \
              "https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions/draft/package/operations/$OP" \
              -H "Authorization: ApiKey $API_KEY" | jq -r '.status')
            echo "  [$i] $STATUS"
            [ "$STATUS" = "Succeeded" ] && break
            [ "$STATUS" = "Failed" ] && exit 1
            sleep 5
          done
          curl -sf -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions" \
            -H "Authorization: ApiKey $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"notes":"Auto-published via CI"}'

      # ── Firefox AMO ────────────────────────────────────────────
      - name: Publish to Firefox AMO
        env:
          AMO_ISSUER: ${{ secrets.AMO_ISSUER }}
          AMO_SECRET: ${{ secrets.AMO_SECRET }}
        run: |
          JWT=$(python3 - <<'EOF'
import hmac, hashlib, base64, json, time, uuid, os

def b64url(data):
    if isinstance(data, str): data = data.encode()
    return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

iat = int(time.time())
h = b64url(json.dumps({'alg':'HS256','typ':'JWT'}, separators=(',',':')))
p = b64url(json.dumps({'iss': os.environ['AMO_ISSUER'], 'jti': str(uuid.uuid4()),
                        'iat': iat, 'exp': iat + 300}, separators=(',',':')))
msg = f'{h}.{p}'
sig = b64url(hmac.new(os.environ['AMO_SECRET'].encode(), msg.encode(), hashlib.sha256).digest())
print(f'{msg}.{sig}')
EOF
)
          curl -sf -X POST \
            "https://addons.mozilla.org/api/v5/addons/a-lovely-day@extension/versions/" \
            -H "Authorization: JWT $JWT" \
            -F "upload=@dist/firefox.xpi"
